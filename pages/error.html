 
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EduTrade - Error</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">


    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8 text-center">


        <!-- Error Icon -->

        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">

            <span class="text-4xl text-red-600">
                !
            </span>

        </div>


        <!-- Title -->

        <h1 class="text-3xl font-bold text-gray-800 mb-3">

            Something went wrong

        </h1>


        <!-- Error Message -->

        <p id="errorMessage"
           class="text-gray-600 mb-3">

            An unexpected error occurred.

        </p>


        <!-- Error Code -->

        <p id="errorCode"
           class="text-sm text-red-500 mb-8">

        </p>


        <!-- Go Back -->

        <button
            onclick="history.back()"
            class="w-full bg-gray-800 hover:bg-gray-900 text-white py-3 rounded-lg mb-3">

            Go Back

        </button>


        <!-- Try Again -->

        <a
            href="register.html"
            class="block w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg mb-3">

            Try Again

        </a>


        <!-- Home -->

        <a
            href="../index.html"
            class="text-green-600 font-medium">

            Back to Home

        </a>


    </div>


    <!-- =====================================
         ERROR JS
    ====================================== -->

    <script>

        const params =
            new URLSearchParams(window.location.search);


        const message =
            params.get("message");


        const code =
            params.get("code");


        if (message) {

            document.getElementById("errorMessage")
                .textContent = message;

        }


        if (code) {

            document.getElementById("errorCode")
                .textContent = `Error Code: ${code}`;

        }

    </script>


</body>

</html>
