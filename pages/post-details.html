<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Details | EduTrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
   <div id="navbar-placeholder"></div>

    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
      <a href="marketplace.html" class="font-semibold text-blue-700"
        >← Back to marketplace</a
      >
      <div class="mt-6 grid gap-7 lg:grid-cols-[1.35fr_.85fr]">
        <section class="overflow-hidden rounded-3xl border bg-white shadow-sm">
          <div class="relative h-72 bg-slate-100 sm:h-96">
            <img
              id="postImage"
              src="../images/default-product.jpg"
              alt="Product"
              class="h-full w-full object-contain"
            /><span
              id="postType"
              class="absolute left-5 top-5 rounded-full px-4 py-1.5 text-sm font-semibold"
            ></span
            ><button
              id="save-post"
              type="button"
              class="absolute right-5 top-5 rounded-full bg-white p-3 text-xl shadow-sm"
              aria-label="Save this item"
            >
              ♡
            </button>
          </div>
          <div class="p-6 sm:p-8">
            <p
              id="postCategory"
              class="text-sm font-semibold text-blue-600"
            ></p>
            <div class="mt-2 flex justify-between gap-4">
              <h1 id="postTitle" class="text-3xl font-extrabold"></h1>
              <p
                id="postPrice"
                class="text-2xl font-extrabold text-blue-600"
              ></p>
            </div>
            <div class="mt-6 grid gap-4 border-y py-5 sm:grid-cols-3">
              <div>
                <p class="text-xs uppercase text-slate-400">Condition</p>
                <p id="postCondition"></p>
              </div>
              <div>
                <p class="text-xs uppercase text-slate-400">Location</p>
                <p id="postLocation"></p>
              </div>
              <div>
                <p class="text-xs uppercase text-slate-400">Posted</p>
                <p id="postDate"></p>
              </div>
            </div>
            <h2 class="mt-7 text-lg font-bold">About this item</h2>
            <p id="postDescription" class="mt-3 leading-7 text-slate-600"></p>
            <div class="mt-7 rounded-2xl bg-slate-50 p-5">
              <h2 class="font-bold">Pickup details</h2>
              <p id="pickupLocation" class="mt-2 text-sm text-slate-600"></p>
            </div>
          </div>
        </section>
        <aside class="space-y-5">
          <section class="rounded-3xl border bg-white p-6 shadow-sm">
            <p class="text-sm font-semibold text-slate-500">Sold by</p>
            <h2 id="postAuthor" class="mt-3 text-xl font-bold"></h2>
            <button
              id="contact-seller"
              type="button"
              class="mt-6 w-full rounded-xl bg-blue-600 px-5 py-3 font-semibold text-white"
            >
              Contact seller
            </button>
            <p
              id="contact-note"
              class="mt-3 hidden text-center text-sm font-medium text-emerald-600"
            >
              Contact: <span id="sellerContact"></span>
            </p>
          </section>
        </aside>
      </div>
    </main>
    <div id="footer-placeholder"></div>

    <script src="../js/post-details.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>

  </body>
</html>
