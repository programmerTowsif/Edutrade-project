<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | EduTrade</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#f7f8fa] text-[#172033]">
    <div id="navbar-placeholder"></div>

    <!-- Login Section -->
    <main class="flex min-h-[calc(100vh-73px)] items-center justify-center px-5 py-12">
        <section class="w-full max-w-md rounded-2xl border border-[#e3e7ed] bg-white p-7 shadow-sm sm:p-8">

            <div class="text-center">
                <p class="text-sm font-medium text-[#6b7280]">Welcome back</p>
                <h1 class="mt-2 text-3xl font-semibold tracking-tight text-[#172033]">
                    Log in to EduTrade
                </h1>
                <p class="mt-3 text-sm leading-6 text-[#6b7280]">
                    Buy, sell, and rent educational resources with other students.
                </p>
            </div>

            <form id="loginForm" class="mt-8 space-y-5">

                <!-- Email -->
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-[#374151]">
                        Email address
                    </label>

                    <input type="email" id="email" placeholder="you@example.com" required
                        class="w-full rounded-lg border border-[#e3e7ed] bg-white px-4 py-3 text-sm text-[#172033] outline-none placeholder:text-[#9ca3af] focus:border-[#172033] focus:ring-2 focus:ring-[#172033]/10" />
                </div>

                <!-- Password -->
                <div>
                    <div class="mb-2 flex items-center justify-between">
                        <label for="password" class="text-sm font-medium text-[#374151]">
                            Password
                        </label>

                        <a href="#" class="text-sm text-[#374151] underline underline-offset-4 hover:text-[#172033]">
                            Forgot password?
                        </a>
                    </div>

                    <input type="password" id="password" placeholder="Enter your password" required
                        class="w-full rounded-lg border border-[#e3e7ed] bg-white px-4 py-3 text-sm text-[#172033] outline-none placeholder:text-[#9ca3af] focus:border-[#172033] focus:ring-2 focus:ring-[#172033]/10" />
                </div>

                <!-- Remember Me -->
                <label class="flex cursor-pointer items-center gap-2 text-sm text-[#6b7280]">
                    <input type="checkbox" id="rememberMe" class="h-4 w-4 rounded border-[#d1d5db] accent-[#172033]" />
                    Remember me
                </label>

                <!-- Login Button -->
                <button type="submit"
                    class="w-full rounded-lg bg-[#172033] px-5 py-3 text-sm font-medium text-white transition hover:bg-[#26344f] focus:outline-none focus:ring-2 focus:ring-[#172033] focus:ring-offset-2">
                    Log in
                </button>
            </form>

            <!-- Register Link -->
            <p class="mt-7 text-center text-sm text-[#6b7280]">
                New to EduTrade?
                <a href="register.html" class="font-medium text-[#172033] underline underline-offset-4">
                    Create an account
                </a>
            </p>

        </section>
    </main>
    <div id="footer-placeholder"></div>

    <script src="../js/login.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
</body>

</html>
